---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/component: route
    app.kubernetes.io/name: argocd-route
    app.kubernetes.io/part-of: argocd
  name: argocd
  namespace: argocd
spec:
  hostnames:
  - argocd.k8s.modlab.cloud
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cilium-gateway
    namespace: kube-system
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      port: 80
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/component: route
    app.kubernetes.io/name: argocd-route
    app.kubernetes.io/part-of: argocd
  name: argocd
  namespace: argocd
spec:
  hostnames:
  - argocd.k8s.modlab.cloud
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cilium-gateway
    namespace: kube-system
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      port: 443
      weight: 1
    matches:
    - headers: 
      - type: Exact
        name: Content-Type
        value: "application/grpc"
